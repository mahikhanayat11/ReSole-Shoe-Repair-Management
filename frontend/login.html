<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ReSole - Login</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="login-logo">

                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2.5 16.2c0-.9.5-1.7 1.3-2.1l3.4-1.7c.5-.3.9-.7 1.1-1.2l1-2.3c.4-.9 1.3-1.5 2.3-1.5h2.1c.6 0 1.1.2 1.6.6l4.3 3.7c.5.4 1.1.7 1.8.7h1.6c1.1 0 2 .9 2 2v2.3c0 1.1-.9 2-2 2H4.5c-1.1 0-2-.9-2-2v-.5z" fill="currentColor"/>
                        <path d="M7 10.5V6.8c0-.7.6-1.3 1.3-1.3h2.4c.5 0 .9.3 1.1.7l1.2 2.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2.5 17.5h19" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    </svg>
                </div>

                <div>

                    <h2>
                        ReSole
                    </h2>

                    <span>
                       Shoe Repair Management
                    </span>

                </div>

            </div>


            <div
                id="loginError"
                class="login-error"
            ></div>


            <form id="loginForm">

                <div class="form-group">

                    <label>
                        Phone Number
                    </label>

                    <input
                        type="text"
                        id="loginPhone"
                        placeholder="Enter phone number"
                        autocomplete="username"
                        required
                    >

                </div>


                <div
                    class="form-group"
                    style="margin-top: 16px;"
                >

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                    id="loginBtn"
                >
                    Login
                </button>

            </form>

        </div>

    </div>

    <script src="./login.js"></script>

</body>

</html>
